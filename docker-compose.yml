# Tek komutla çalışan geliştirme/demo ortamı: docker compose up --build
name: insider-notification-system

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-insider}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insider}
      POSTGRES_DB: ${POSTGRES_DB:-notifications}
    ports:
      # Yalnızca localhost'a açılır: makine dışından erişilebilen açık bir veritabanı kalmasın.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ imajlari veriyi surum adli bir alt dizine koyar; mount bu yuzden
      # /var/lib/postgresql/data degil /var/lib/postgresql seviyesinde olmali
      # (aksi halde imaj "unused mount/volume" diyerek baslamiyor).
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # pg_isready, sunucunun bağlantı kabul ettiğini doğrular; api yalnızca bundan sonra başlar.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insider} -d ${POSTGRES_DB:-notifications}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    # appendonly kapalı: Redis yalnızca rate limit jetonları ve pub/sub için kullanılıyor,
    # kaybı tolere edilebilir. Kalıcı veri PostgreSQL'de.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Tek seferlik (one-shot) job: şemayı kurar ve çıkar. api bunun başarıyla bitmesini
  # bekler — Adım 1'deki bağımlılık beklemesi "Postgres ayakta" diyor ama "tablolar var"
  # demiyordu; migration'ı uygulama içinde çalıştırmak ise birden çok kopya ölçeklendiğinde
  # yarış durumu yaratırdı.
  migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      # Read-write bağlanıyor: `make migrate-create` yeni dosya çiftini buraya üretir.
      - ./migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-insider}:${POSTGRES_PASSWORD:-insider}@postgres:5432/${POSTGRES_DB:-notifications}?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    # Başarıyla bitip çıkması normaldir; yeniden başlatılmamalı.
    restart: "no"

  # Ayarlanabilir hata oranı ve gecikmesi olan sahte sağlayıcı.
  #
  # Neden: webhook.site ücretsiz URL'i 100 istek / 7 gün ile sınırlı, tek bir yük testi
  # kotayı bitirir. Yük, retry ve rate limit senaryoları bu servise karşı ölçülür.
  mockprovider:
    build:
      context: .
      args:
        CMD: mockprovider
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MOCK_PORT: "8081"
      MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-0}
      MOCK_RATE_LIMIT_RATE: ${MOCK_RATE_LIMIT_RATE:-0}
      MOCK_BAD_REQUEST_RATE: ${MOCK_BAD_REQUEST_RATE:-0}
      MOCK_LATENCY: ${MOCK_LATENCY:-50ms}
      MOCK_LATENCY_JITTER: ${MOCK_LATENCY_JITTER:-0s}
    ports:
      # Host'a açılıyor ki /config ve /stats curl ile kullanılabilsin (demo adımı 5).
      - "127.0.0.1:${MOCK_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8081/health/live"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped

  api:
    build:
      context: .
      args:
        CMD: api
    env_file: .env
    environment:
      # Container ağı içindeki adresler .env'deki değerleri ezer: aynı .env hem
      # host'tan (make run) hem compose içinden çalışsın.
      DATABASE_URL: postgres://${POSTGRES_USER:-insider}:${POSTGRES_PASSWORD:-insider}@postgres:5432/${POSTGRES_DB:-notifications}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      # Container İÇİNDEKİ port SABİT. .env'den gelen HTTP_PORT yalnızca HOST portunu
      # seçmeli (aşağıdaki ports eşlemesi): ikisi birden olduğunda HTTP_PORT=9090
      # yazan biri uygulamayı container içinde 9090'a bağlıyor, eşleme ise host
      # 9090'ı container 8080'e gönderiyor ve orada kimse dinlemiyor — healthcheck de
      # 8080'i yokladığı için servis kalıcı olarak unhealthy kalıyordu.
      # mockprovider aynı kalıbı MOCK_PORT için zaten uyguluyor.
      HTTP_PORT: "8080"
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    # SIGTERM sonrası graceful shutdown'a zaman tanınır (SHUTDOWN_TIMEOUT ile uyumlu).
    stop_grace_period: 20s
    restart: unless-stopped

  # Gönderim motoru. API'den ayrı process: sağlayıcı yavaşladığında API yanıt
  # süreleri etkilenmez ve gönderim kapasitesi bağımsız ölçeklenir.
  #
  # HTTP dinlemiyor, bu yüzden healthcheck yok (Adım 9'da /metrics kararıyla gelecek).
  # Port da yok: `docker compose up -d --scale worker=3` çakışma üretmesin.
  worker:
    build:
      context: .
      args:
        CMD: worker
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-insider}:${POSTGRES_PASSWORD:-insider}@postgres:5432/${POSTGRES_DB:-notifications}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      # Varsayılan olarak mock'a bakar: webhook.site'in 100 istek / 7 gün kotası tek
      # yük testinde biterdi. Gerçek sağlayıcı demosu için WORKER_PROVIDER_URL ezilir.
      PROVIDER_URL: ${WORKER_PROVIDER_URL:-http://mockprovider:8081/send}
    depends_on:
      postgres:
        condition: service_healthy
      # Hız sınırı Redis'teki paylaşılan kovada: Redis olmadan worker gönderim
      # yapamaz (fail closed), o yüzden hazır olmasını bekliyor.
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mockprovider:
        condition: service_healthy
    # Kapanış penceresinden uzun: WORKER_CLAIM_TIMEOUT (3s, claim kapanıştan muaf) +
    # WORKER_DRAIN_TIMEOUT (20s, uçan gönderim + sonuç yazımı) = 23s < 30s.
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
